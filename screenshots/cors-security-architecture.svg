<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchCORS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchCORS)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    Web App Security Architecture: Vulnerable CORS vs Zero-Trust Enforced
  </text>

  <!-- Left: Flawed Deployment -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#140c14" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Wildcard CORS &amp; Missing Headers
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#080c1a" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Access-Control-Allow-Origin: * &bull; Allow-Credentials: true</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Missing CSP &bull; Missing HSTS &bull; Missing nosniff &bull; No XFO</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CATASTROPHIC ATTACK VECTORS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Malicious sites fetch authenticated API data via reflected origins</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Stored XSS executes unrestricted inline JS without CSP defense</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Cleartext HTTP downgrade attacks via missing HSTS</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Clickjacking overlays trick users into executing financial transfers</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ACCOUNT TAKEOVER &bull; DATA THEFT &bull; OWASP TOP 10 VIOLATIONS</text>

  <!-- Right: Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#081826" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: CORSHeaderForge Pro Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#080c1a" stroke="#242f5d"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">Exact Origin Map &bull; Preflight Cached (Max-Age: 86400)</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">CSP Level 3 + Nonce &bull; HSTS Preload &bull; COOP/CORP Same-Origin</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ENTERPRISE ZERO-TRUST DEFENSES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Dynamic Nginx/Cloudflare maps restrict credentials to verified origins</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; CSP Level 3 blocks inline script execution and unauthorized hosts</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; HSTS Preload enforces 100% TLS connections across all subdomains</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; COOP/CORP headers provide browser process-level Spectre isolation</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">MOZILLA OBSERVATORY A+ &bull; OWASP SECURE &bull; ZERO EXPOSURE</text>
</svg>
